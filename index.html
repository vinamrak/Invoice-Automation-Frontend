<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Download Latest Invoice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }
    button {
      font-size: 16px;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <button id="btn">Download latest invoice</button>

  <script>
    const BACKEND_URL = "http://localhost:8000/download-all-invoices";

    async function downloadInvoice() {
      const btn = document.getElementById("btn");
      btn.disabled = true;
      btn.textContent = "Preparing…";

      try {
        const res = await fetch(BACKEND_URL, { method: "GET" });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || ("Request failed: " + res.status));
        }

        // Default filename fallback
        let filename = "All_Invoices.zip";

        // Extract filename from headers if provided
        const contentDisposition = res.headers.get("Content-Disposition");
        if (contentDisposition && contentDisposition.includes("filename=")) {
          const match = contentDisposition.match(/filename="?([^"]+)"?/i);
          if (match) {
            filename = match[1];
          }
        }

        // Get file as blob
        const blob = await res.blob();

        // Create temporary download link
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();

        // Clean up
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("Could not download invoice:\n" + (err?.message || err));
      } finally {
        btn.disabled = false;
        btn.textContent = "Download latest invoice";
      }
    }

    document.getElementById("btn").addEventListener("click", downloadInvoice);
  </script>
</body>
</html>
